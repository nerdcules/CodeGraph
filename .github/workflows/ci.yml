# Build and test on each push to main and each pull request, on the three platforms the release ships for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: codegraph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: codegraph/global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before the .NET tests: the TypeScript index and live tests skip themselves when these packages are missing.
      - name: TypeScript extractor packages
        working-directory: codegraph/extractors/typescript
        run: npm ci --no-audit --no-fund

      - name: Build (warnings are errors)
        run: dotnet build CodeGraph.slnx -c Release -warnaserror --nologo

      # A stall ends the step with its log kept; a runner that dies keeps none (macOS, PR #5).
      - name: Test
        timeout-minutes: 20
        run: dotnet test CodeGraph.slnx -c Release --no-build --output detailed

      - name: TypeScript extractor tests
        working-directory: codegraph/extractors/typescript
        run: npm test

      # The OS reports a process's working directory with symlinks resolved; a checkout under macOS /tmp once built twice.
      # Linux resolves it the same way and showed the same bug, so the check runs on both.
      - name: Install from a checkout reached through a symlink
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: tests/install-through-symlink.sh

      # The VS Code extension: unit tests; its install code against a published release; the extension driven inside
      # VS Code against the indexer and server built above (index, the MCP server it offers, a stale edit, a live
      # daemon, stop, rebuild); then the .vsix it would ship.
      - name: VS Code extension packages
        working-directory: codegraph/vscode-extension
        run: npm ci --no-audit --no-fund

      - name: VS Code extension unit tests
        working-directory: codegraph/vscode-extension
        run: npm test

      # Downloads the 1.2.0 archive for this runner (89 to 115 MB), then updates with codegraph-mcp running from the
      # folder: refused with nothing changed on Windows, replaced under the running program elsewhere.
      - name: VS Code extension install and update
        working-directory: codegraph/vscode-extension
        timeout-minutes: 10
        env:
          CODEGRAPH_TEST_INSTALL_RELEASE: '1'
        run: npm run test:install

      - uses: actions/cache@v4
        with:
          path: codegraph/vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('codegraph/vscode-extension/package-lock.json') }}

      - name: VS Code extension integration tests
        working-directory: codegraph/vscode-extension
        shell: bash
        env:
          CODEGRAPH_TEST_INSTALL_DIR: ${{ github.workspace }}/codegraph/src/CodeGraph.Indexer/bin/Release/net10.0
          # The indexer's build output has no codegraph-mcp; the MCP step starts the server's own build.
          CODEGRAPH_TEST_MCP: ${{ github.workspace }}/codegraph/src/CodeGraph.Mcp/bin/Release/net10.0/codegraph-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:integration; else npm run test:integration; fi

      - name: VS Code extension packs
        if: runner.os == 'Linux'
        working-directory: codegraph/vscode-extension
        run: npm run package

      - name: Packaging script runs
        if: runner.os == 'Linux'
        env:
          CODEGRAPH_VERSION: 0.0.0-ci
        run: tools/release/package.sh linux-x64
