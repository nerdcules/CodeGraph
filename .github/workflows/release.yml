# A tag v<version> builds, tests and packages codegraph-index and codegraph-mcp for six platforms, and publishes
# them as a GitHub Release with checksums, beside the VS Code extension (codegraph-vscode.vsix). The version in the
# executables and the extension comes from the tag; a tag with a "-suffix" is published as a pre-release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codegraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: codegraph/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Before the .NET tests: the TypeScript index and live tests skip themselves when these packages are missing.
      - working-directory: codegraph/extractors/typescript
        run: npm ci --no-audit --no-fund
      - run: dotnet build CodeGraph.slnx -c Release -warnaserror --nologo
      - run: dotnet test CodeGraph.slnx -c Release --no-build
      - working-directory: codegraph/extractors/typescript
        run: npm test

  package:
    needs: test
    name: ${{ matrix.rids }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64
          - os: macos-latest
            rids: osx-x64 osx-arm64
          - os: windows-latest
            rids: win-x64 win-arm64
    defaults:
      run:
        working-directory: codegraph
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: codegraph/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        env:
          CODEGRAPH_VERSION: ${{ github.ref_name }}
        run: tools/release/package.sh ${{ matrix.rids }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: codegraph/dist/*

  vsix:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codegraph/vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # The extension's version is the tag's, like the executables'.
      - run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: codegraph/dist/codegraph-vscode.vsix

  release:
    needs: [package, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: codegraph/tools/release/notes.sh "${{ github.ref_name }}" codegraph/CHANGELOG.md > notes.md && cat notes.md
      # A tag with a "-suffix" (v1.3.0-beta.1) is published as a pre-release: GitHub's "latest" stays on the last
      # release, so the installers, the Claude Code plugin and releases/latest/download/ links do not move to it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          kind=()
          if [[ "$TAG" == *-* ]]; then kind=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* --title "CodeGraph $TAG" --notes-file notes.md --verify-tag "${kind[@]}"
