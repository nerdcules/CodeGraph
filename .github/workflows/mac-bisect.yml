# TEMPORARY (PR #5): the macOS runner dies during `dotnet test` on this branch and keeps no log. Each job runs one
# slice of the suite, so the job that dies names the slice. Round 1 (one test per job) passed everywhere; round 2
# runs the whole suite in one process, leaving one new test out per job: it passed without A_damaged_graph (or two
# others) and stalled otherwise. Round 3 runs the whole suite three times after GraphStore.Open stopped retrying a
# damaged file. Delete this file once the cause is found.
name: macOS bisect

on:
  push:
    branches: [vscode-extension]

permissions:
  contents: read

jobs:
  slice:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whole suite, try 1
            filter: FullyQualifiedName~CodeGraph.Tests
          - name: whole suite, try 2
            filter: FullyQualifiedName~CodeGraph.Tests
          - name: whole suite, try 3
            filter: FullyQualifiedName~CodeGraph.Tests
    defaults:
      run:
        working-directory: codegraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: codegraph/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: codegraph/extractors/typescript
        run: npm ci --no-audit --no-fund
      - run: dotnet build CodeGraph.slnx -c Release -warnaserror --nologo
      - name: Test slice
        timeout-minutes: 15
        run: dotnet test tests/CodeGraph.Tests -c Release --no-build --output detailed --filter "${{ matrix.filter }}"
