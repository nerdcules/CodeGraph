<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc">
<title id="title">A typical turn</title>
<desc id="desc">Sequence diagram: the developer asks a question, Claude Code calls find_symbol, impact_of and snippet on codegraph-mcp, each call reads graph.db, and Claude answers from about three thousand tokens.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .t { font-weight: 600; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
  .group { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .a1 { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
  .a2 { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
  .a3 { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
  .a4 { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
  .line { fill: none; stroke: #59636e; stroke-width: 1.4; }
  .dash { fill: none; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .head { fill: #59636e; }
  .headp { fill: #8250df; }
  .bar1 { fill: #0969da; } .bar2 { fill: #1a7f37; } .bar3 { fill: #8250df; } .bar4 { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .num { fill: #ffffff; font-weight: 600; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .group { stroke: #3d444d; }
    .a1 { fill: #0c2d6b; stroke: #4493f8; }
    .a2 { fill: #033a16; stroke: #3fb950; }
    .a3 { fill: #2e1461; stroke: #ab7df8; }
    .a4 { fill: #3b2300; stroke: #d29922; }
    .line { stroke: #9198a1; } .head { fill: #9198a1; }
    .dash { stroke: #ab7df8; } .headp { fill: #ab7df8; }
    .bar1 { fill: #4493f8; } .bar2 { fill: #3fb950; } .bar3 { fill: #ab7df8; } .bar4 { fill: #d29922; }
    .grid { stroke: #3d444d; }
    .num { fill: #0d1117; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headp" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="400" rx="10"/>
<rect x="10" y="20" width="160" height="38" rx="8" class="box"/>
<text x="90.0" y="43.5" class="t" text-anchor="middle">Developer</text>
<line x1="90" y1="58" x2="90" y2="380" class="grid" stroke-dasharray="4 4"/>
<rect x="240" y="20" width="160" height="38" rx="8" class="box"/>
<text x="320.0" y="43.5" class="t" text-anchor="middle">Claude Code</text>
<line x1="320" y1="58" x2="320" y2="380" class="grid" stroke-dasharray="4 4"/>
<rect x="480" y="20" width="160" height="38" rx="8" class="a3"/>
<text x="560.0" y="43.5" class="t" text-anchor="middle">codegraph-mcp</text>
<line x1="560" y1="58" x2="560" y2="380" class="grid" stroke-dasharray="4 4"/>
<rect x="710" y="20" width="160" height="38" rx="8" class="a2"/>
<text x="790.0" y="43.5" class="t" text-anchor="middle">graph.db</text>
<line x1="790" y1="58" x2="790" y2="380" class="grid" stroke-dasharray="4 4"/>
<path d="M90 88 H314" class="line" marker-end="url(#arrow)"/>
<text x="205.0" y="81" class="m" text-anchor="middle">What breaks if I change SaveAsync?</text>
<path d="M320 130 H554" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="123" class="mono" text-anchor="middle">find_symbol &quot;SaveAsync&quot;</text>
<path d="M560 152 H784" class="line" marker-end="url(#arrow)"/>
<text x="675.0" y="145" class="m" text-anchor="middle">SQL</text>
<path d="M560 174 H326" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="167" class="m" text-anchor="middle">1 row: the id</text>
<path d="M320 216 H554" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="209" class="mono" text-anchor="middle">impact_of &lt;id&gt;</text>
<path d="M560 238 H784" class="line" marker-end="url(#arrow)"/>
<text x="675.0" y="231" class="m" text-anchor="middle">recursive SQL</text>
<path d="M560 260 H326" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="253" class="m" text-anchor="middle">6 dependents, 3 tests</text>
<path d="M320 302 H554" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="295" class="mono" text-anchor="middle">snippet &lt;caller id&gt;</text>
<path d="M560 324 H326" class="line" marker-end="url(#arrow)"/>
<text x="440.0" y="317" class="m" text-anchor="middle">12 source lines</text>
<path d="M320 362 H96" class="line" marker-end="url(#arrow)"/>
<text x="205.0" y="355" class="m" text-anchor="middle">Answer, with the files to change</text>
</svg>
