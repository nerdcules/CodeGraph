<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" role="img" aria-labelledby="title desc">
<title id="title">Tool calls through the MCP server on Jellyfin, before and after the in-memory graph</title>
<desc id="desc">Bar chart on a logarithmic scale. Milliseconds per tool call through codegraph-mcp, calls two seconds apart, on the Jellyfin graph of 21,174 nodes and 108,946 edges: answered by recursive SQL in DuckDB before, and from the graph held in memory after.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .t { font-weight: 600; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
  .group { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .a1 { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
  .a2 { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
  .a3 { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
  .a4 { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
  .line { fill: none; stroke: #59636e; stroke-width: 1.4; }
  .dash { fill: none; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .head { fill: #59636e; }
  .headp { fill: #8250df; }
  .bar1 { fill: #0969da; } .bar2 { fill: #1a7f37; } .bar3 { fill: #8250df; } .bar4 { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .num { fill: #ffffff; font-weight: 600; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .group { stroke: #3d444d; }
    .a1 { fill: #0c2d6b; stroke: #4493f8; }
    .a2 { fill: #033a16; stroke: #3fb950; }
    .a3 { fill: #2e1461; stroke: #ab7df8; }
    .a4 { fill: #3b2300; stroke: #d29922; }
    .line { stroke: #9198a1; } .head { fill: #9198a1; }
    .dash { stroke: #ab7df8; } .headp { fill: #ab7df8; }
    .bar1 { fill: #4493f8; } .bar2 { fill: #3fb950; } .bar3 { fill: #ab7df8; } .bar4 { fill: #d29922; }
    .grid { stroke: #3d444d; }
    .num { fill: #0d1117; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headp" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="432" rx="10"/>
<text x="20" y="30" class="h" text-anchor="start">Tool calls through the MCP server, Jellyfin (21,174 nodes, 108,946 edges)</text>
<line x1="308.4" y1="48" x2="308.4" y2="340" class="grid"/>
<text x="308.4" y="356" class="m" text-anchor="middle">1 ms</text>
<line x1="458.4" y1="48" x2="458.4" y2="340" class="grid"/>
<text x="458.4" y="356" class="m" text-anchor="middle">10 ms</text>
<line x1="608.4" y1="48" x2="608.4" y2="340" class="grid"/>
<text x="608.4" y="356" class="m" text-anchor="middle">100 ms</text>
<line x1="758.4" y1="48" x2="758.4" y2="340" class="grid"/>
<text x="758.4" y="356" class="m" text-anchor="middle">1,000 ms</text>
<text x="218" y="69" class="" text-anchor="end">graph_stats</text>
<rect x="230" y="56" width="263.0" height="15" rx="3" class="bar4"/>
<text x="501.0" y="68" class="m" text-anchor="start">17 ms</text>
<rect x="230" y="74" width="100.4" height="15" rx="3" class="bar2"/>
<text x="338.4" y="86" class="m" text-anchor="start">1.4 ms</text>
<text x="218" y="117" class="" text-anchor="end">find_symbol</text>
<text x="218" y="131" class="m" text-anchor="end">'Dispose'</text>
<rect x="230" y="104" width="321.9" height="15" rx="3" class="bar4"/>
<text x="559.9" y="116" class="m" text-anchor="start">42 ms</text>
<rect x="230" y="122" width="220.1" height="15" rx="3" class="bar2"/>
<text x="458.1" y="134" class="m" text-anchor="start">8.8 ms</text>
<text x="218" y="165" class="" text-anchor="end">callers_of</text>
<text x="218" y="179" class="m" text-anchor="end">depth 1, most-called</text>
<rect x="230" y="152" width="358.8" height="15" rx="3" class="bar4"/>
<text x="596.8" y="164" class="m" text-anchor="start">74 ms</text>
<rect x="230" y="170" width="129.8" height="15" rx="3" class="bar2"/>
<text x="367.8" y="182" class="m" text-anchor="start">2.2 ms</text>
<text x="218" y="213" class="" text-anchor="end">impact_of</text>
<text x="218" y="227" class="m" text-anchor="end">depth 5</text>
<rect x="230" y="200" width="435.5" height="15" rx="3" class="bar4"/>
<text x="673.5" y="212" class="m" text-anchor="start">240 ms</text>
<rect x="230" y="218" width="212.2" height="15" rx="3" class="bar2"/>
<text x="450.2" y="230" class="m" text-anchor="start">7.8 ms</text>
<text x="218" y="261" class="" text-anchor="end">impact_of</text>
<text x="218" y="275" class="m" text-anchor="end">depth 20</text>
<rect x="230" y="248" width="518.6" height="15" rx="3" class="bar4"/>
<text x="756.6" y="260" class="m" text-anchor="start">860 ms</text>
<rect x="230" y="266" width="226.4" height="15" rx="3" class="bar2"/>
<text x="464.4" y="278" class="m" text-anchor="start">9.7 ms</text>
<text x="218" y="309" class="" text-anchor="end">covered_by</text>
<text x="218" y="323" class="m" text-anchor="end">depth 30</text>
<rect x="230" y="296" width="538.8" height="15" rx="3" class="bar4"/>
<text x="776.8" y="308" class="m" text-anchor="start">1,173 ms</text>
<rect x="230" y="314" width="184.6" height="15" rx="3" class="bar2"/>
<text x="422.6" y="326" class="m" text-anchor="start">5.1 ms</text>
<text x="20" y="382" class="m" text-anchor="start">Median of calls two seconds apart (a model's pace), full MCP round trip over stdio. Logarithmic scale.</text>
<rect x="20" y="394" width="12" height="12" rx="2" class="bar4"/>
<text x="38" y="404" class="m" text-anchor="start">Before: recursive SQL in DuckDB, the file opened per call</text>
<rect x="430" y="394" width="12" height="12" rx="2" class="bar2"/>
<text x="448" y="404" class="m" text-anchor="start">After: the graph held in memory by the server</text>
</svg>
