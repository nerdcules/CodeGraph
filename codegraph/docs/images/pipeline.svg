<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title desc">
<title id="title">How a graph is built and queried</title>
<desc id="desc">Top row: the indexer reads code with the compiler, makes records, and writes a new graph file. Bottom row: a tool call checks freshness, runs SQL and returns a short answer.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .t { font-weight: 600; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
  .group { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .a1 { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
  .a2 { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
  .a3 { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
  .a4 { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
  .line { fill: none; stroke: #59636e; stroke-width: 1.4; }
  .dash { fill: none; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .head { fill: #59636e; }
  .headp { fill: #8250df; }
  .bar1 { fill: #0969da; } .bar2 { fill: #1a7f37; } .bar3 { fill: #8250df; } .bar4 { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .num { fill: #ffffff; font-weight: 600; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .group { stroke: #3d444d; }
    .a1 { fill: #0c2d6b; stroke: #4493f8; }
    .a2 { fill: #033a16; stroke: #3fb950; }
    .a3 { fill: #2e1461; stroke: #ab7df8; }
    .a4 { fill: #3b2300; stroke: #d29922; }
    .line { stroke: #9198a1; } .head { fill: #9198a1; }
    .dash { stroke: #ab7df8; } .headp { fill: #ab7df8; }
    .bar1 { fill: #4493f8; } .bar2 { fill: #3fb950; } .bar3 { fill: #ab7df8; } .bar4 { fill: #d29922; }
    .grid { stroke: #3d444d; }
    .num { fill: #0d1117; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headp" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="330" rx="10"/>
<text x="20" y="30" class="h" text-anchor="start">Index</text>
<rect x="20" y="46" width="190" height="86" rx="8" class="a1"/>
<text x="115.0" y="76.5" class="t" text-anchor="middle">1  Read</text>
<text x="115.0" y="93.5" class="m" text-anchor="middle">the compiler resolves</text>
<text x="115.0" y="110.5" class="m" text-anchor="middle">every symbol</text>
<rect x="240" y="46" width="190" height="86" rx="8" class="a1"/>
<text x="335.0" y="76.5" class="t" text-anchor="middle">2  Make records</text>
<text x="335.0" y="93.5" class="m" text-anchor="middle">nodes, edges, files,</text>
<text x="335.0" y="110.5" class="m" text-anchor="middle">search terms</text>
<path d="M212 89 H238" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="46" width="190" height="86" rx="8" class="a2"/>
<text x="555.0" y="76.5" class="t" text-anchor="middle">3  Write</text>
<text x="555.0" y="93.5" class="m" text-anchor="middle">a fresh file; copy the</text>
<text x="555.0" y="110.5" class="m" text-anchor="middle">other languages</text>
<path d="M432 89 H458" class="line" marker-end="url(#arrow)"/>
<rect x="680" y="46" width="190" height="86" rx="8" class="a2"/>
<text x="775.0" y="76.5" class="t" text-anchor="middle">4  Swap</text>
<text x="775.0" y="93.5" class="m" text-anchor="middle">replace graph.db in one</text>
<text x="775.0" y="110.5" class="m" text-anchor="middle">rename; record hashes</text>
<path d="M652 89 H678" class="line" marker-end="url(#arrow)"/>
<text x="20" y="182" class="h" text-anchor="start">Query</text>
<rect x="20" y="198" width="190" height="86" rx="8" class="a3"/>
<text x="115.0" y="228.5" class="t" text-anchor="middle">1  Tool call</text>
<text x="115.0" y="245.5" class="m" text-anchor="middle">find_symbol, impact_of,</text>
<text x="115.0" y="262.5" class="m" text-anchor="middle">tests_for, ...</text>
<rect x="240" y="198" width="190" height="86" rx="8" class="a4"/>
<text x="335.0" y="228.5" class="t" text-anchor="middle">2  Check freshness</text>
<text x="335.0" y="245.5" class="m" text-anchor="middle">ask the daemon, or</text>
<text x="335.0" y="262.5" class="m" text-anchor="middle">compare file hashes</text>
<path d="M212 241 H238" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="198" width="190" height="86" rx="8" class="a2"/>
<text x="555.0" y="228.5" class="t" text-anchor="middle">3  Run SQL</text>
<text x="555.0" y="245.5" class="m" text-anchor="middle">recursive walk on</text>
<text x="555.0" y="262.5" class="m" text-anchor="middle">indexed edges</text>
<path d="M432 241 H458" class="line" marker-end="url(#arrow)"/>
<rect x="680" y="198" width="190" height="86" rx="8" class="a3"/>
<text x="775.0" y="228.5" class="t" text-anchor="middle">4  Answer</text>
<text x="775.0" y="245.5" class="m" text-anchor="middle">nearest 200 rows,</text>
<text x="775.0" y="262.5" class="m" text-anchor="middle">counts for the rest</text>
<path d="M652 241 H678" class="line" marker-end="url(#arrow)"/>
<text x="450" y="314" class="m" text-anchor="middle">Stale rows are marked. The server never writes to the graph.</text>
</svg>
