<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title desc">
<title id="title">How the Obsidian plugin uses the graph</title>
<desc id="desc">In the repository, the indexer reads the source files and writes graph.db. The plugin in the vault runs the export, which writes the generated notes in the _code folder. Your own notes in docs link into _code. The plugin watches the graph and exports again after a re-index. The live panel asks codegraph-mcp over stdio, and codegraph-mcp reads graph.db.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .t { font-weight: 600; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
  .group { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .a1 { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
  .a2 { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
  .a3 { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
  .a4 { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
  .line { fill: none; stroke: #59636e; stroke-width: 1.4; }
  .dash { fill: none; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .head { fill: #59636e; }
  .headp { fill: #8250df; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .group { stroke: #3d444d; }
    .a1 { fill: #0c2d6b; stroke: #4493f8; }
    .a2 { fill: #033a16; stroke: #3fb950; }
    .a3 { fill: #2e1461; stroke: #ab7df8; }
    .a4 { fill: #3b2300; stroke: #d29922; }
    .line { stroke: #9198a1; } .head { fill: #9198a1; }
    .dash { stroke: #ab7df8; } .headp { fill: #ab7df8; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headp" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="330" rx="10"/>

<rect class="group" x="10" y="14" width="592" height="302" rx="10"/>
<text x="24" y="38" class="h">Repository (worktree)</text>
<rect class="group" x="618" y="14" width="272" height="302" rx="10"/>
<text x="632" y="38" class="h">Obsidian vault</text>

<rect x="24" y="62" width="150" height="56" rx="8" class="box"/>
<text x="99" y="86" class="t" text-anchor="middle">Source files</text>
<text x="99" y="103" class="m" text-anchor="middle">any supported language</text>

<rect x="214" y="62" width="176" height="56" rx="8" class="a1"/>
<text x="302" y="86" class="t mono" text-anchor="middle">codegraph-index</text>
<text x="302" y="103" class="m" text-anchor="middle">--watch: re-index on save</text>

<rect x="430" y="62" width="156" height="56" rx="8" class="a2"/>
<text x="508" y="86" class="t mono" text-anchor="middle">graph.db</text>
<text x="508" y="103" class="m" text-anchor="middle">in .codegraph/</text>

<rect x="430" y="240" width="156" height="56" rx="8" class="a3"/>
<text x="508" y="264" class="t mono" text-anchor="middle">codegraph-mcp</text>
<text x="508" y="281" class="m" text-anchor="middle">command from .mcp.json</text>

<rect x="632" y="54" width="244" height="56" rx="8" class="a1"/>
<text x="754" y="78" class="t" text-anchor="middle"><tspan class="mono">_code/</tspan>  generated notes</text>
<text x="754" y="95" class="m" text-anchor="middle">projects, types, reports</text>

<rect x="632" y="140" width="244" height="56" rx="8" class="box"/>
<text x="754" y="164" class="t" text-anchor="middle"><tspan class="mono">docs/</tspan>  your notes</text>
<text x="754" y="181" class="m" text-anchor="middle">features, decisions; never rewritten</text>

<rect x="632" y="240" width="244" height="56" rx="8" class="a4"/>
<text x="754" y="264" class="t" text-anchor="middle">CodeGraph plugin</text>
<text x="754" y="281" class="m" text-anchor="middle">live panel, find symbol, code links</text>

<path class="line" d="M174,90 L210,90" marker-end="url(#arrow)"/>
<path class="line" d="M390,90 L426,90" marker-end="url(#arrow)"/>

<path class="line" d="M586,82 L628,82" marker-end="url(#arrow)"/>
<text x="607" y="74" class="m" text-anchor="middle">export</text>

<path class="dash" d="M754,140 L754,114" marker-end="url(#arrowp)"/>
<text x="762" y="131" class="m">links</text>

<path class="line" d="M508,236 L508,122" marker-end="url(#arrow)"/>
<text x="516" y="182" class="m">reads</text>

<path class="line" d="M590,268 L628,268" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="609" y="260" class="m" text-anchor="middle">stdio</text>

<path class="dash" d="M646,238 C 618,206 604,150 590,122" marker-end="url(#arrowp)"/>
<text x="598" y="214" class="m" text-anchor="end">watches,</text>
<text x="598" y="228" class="m" text-anchor="end">exports again</text>
</svg>
