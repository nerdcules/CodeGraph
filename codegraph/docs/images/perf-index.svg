<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-labelledby="title desc">
<title id="title">Index time, largest generated codebase per language</title>
<desc id="desc">Bar chart. Seconds to index the largest generated codebase of each language in a Docker container with 2 CPUs.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .t { font-weight: 600; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
  .group { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .a1 { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
  .a2 { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
  .a3 { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
  .a4 { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
  .line { fill: none; stroke: #59636e; stroke-width: 1.4; }
  .dash { fill: none; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .head { fill: #59636e; }
  .headp { fill: #8250df; }
  .bar1 { fill: #0969da; } .bar2 { fill: #1a7f37; } .bar3 { fill: #8250df; } .bar4 { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .num { fill: #ffffff; font-weight: 600; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .group { stroke: #3d444d; }
    .a1 { fill: #0c2d6b; stroke: #4493f8; }
    .a2 { fill: #033a16; stroke: #3fb950; }
    .a3 { fill: #2e1461; stroke: #ab7df8; }
    .a4 { fill: #3b2300; stroke: #d29922; }
    .line { stroke: #9198a1; } .head { fill: #9198a1; }
    .dash { stroke: #ab7df8; } .headp { fill: #ab7df8; }
    .bar1 { fill: #4493f8; } .bar2 { fill: #3fb950; } .bar3 { fill: #ab7df8; } .bar4 { fill: #d29922; }
    .grid { stroke: #3d444d; }
    .num { fill: #0d1117; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headp" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="454" rx="10"/>
<text x="20" y="30" class="h" text-anchor="start">Index time, largest generated codebase per language</text>
<line x1="230.0" y1="48" x2="230.0" y2="384" class="grid"/>
<text x="230.0" y="400" class="m" text-anchor="middle">0 s</text>
<line x1="375.0" y1="48" x2="375.0" y2="384" class="grid"/>
<text x="375.0" y="400" class="m" text-anchor="middle">5 s</text>
<line x1="520.0" y1="48" x2="520.0" y2="384" class="grid"/>
<text x="520.0" y="400" class="m" text-anchor="middle">10 s</text>
<line x1="665.0" y1="48" x2="665.0" y2="384" class="grid"/>
<text x="665.0" y="400" class="m" text-anchor="middle">15 s</text>
<line x1="810.0" y1="48" x2="810.0" y2="384" class="grid"/>
<text x="810.0" y="400" class="m" text-anchor="middle">20 s</text>
<text x="218" y="67" class="" text-anchor="end">JavaScript</text>
<text x="218" y="80" class="m" text-anchor="end">27,564 lines</text>
<rect x="230" y="54" width="123.0" height="22" rx="4" class="bar1"/>
<text x="361.0" y="70" class="m" text-anchor="start">4.24 s</text>
<text x="218" y="107" class="" text-anchor="end">TypeScript</text>
<text x="218" y="120" class="m" text-anchor="end">41,418 lines</text>
<rect x="230" y="94" width="178.1" height="22" rx="4" class="bar1"/>
<text x="416.1" y="110" class="m" text-anchor="start">6.14 s</text>
<text x="218" y="147" class="" text-anchor="end">Angular</text>
<text x="218" y="160" class="m" text-anchor="end">54,979 lines</text>
<rect x="230" y="134" width="244.8" height="22" rx="4" class="bar1"/>
<text x="482.8" y="150" class="m" text-anchor="start">8.44 s</text>
<text x="218" y="187" class="" text-anchor="end">Rust</text>
<text x="218" y="200" class="m" text-anchor="end">50,904 lines</text>
<rect x="230" y="174" width="357.3" height="22" rx="4" class="bar3"/>
<text x="595.3" y="190" class="m" text-anchor="start">12.32 s</text>
<text x="218" y="227" class="" text-anchor="end">C#</text>
<text x="218" y="240" class="m" text-anchor="end">43,927 lines</text>
<rect x="230" y="214" width="365.1" height="22" rx="4" class="bar2"/>
<text x="603.1" y="230" class="m" text-anchor="start">12.59 s</text>
<text x="218" y="267" class="" text-anchor="end">Python</text>
<text x="218" y="280" class="m" text-anchor="end">41,439 lines</text>
<rect x="230" y="254" width="387.1" height="22" rx="4" class="bar3"/>
<text x="625.1" y="270" class="m" text-anchor="start">13.35 s</text>
<text x="218" y="307" class="" text-anchor="end">Java</text>
<text x="218" y="320" class="m" text-anchor="end">37,219 lines</text>
<rect x="230" y="294" width="478.8" height="22" rx="4" class="bar3"/>
<text x="716.8" y="310" class="m" text-anchor="start">16.51 s</text>
<text x="218" y="347" class="" text-anchor="end">Go</text>
<text x="218" y="360" class="m" text-anchor="end">30,733 lines</text>
<rect x="230" y="334" width="526.6" height="22" rx="4" class="bar3"/>
<text x="764.6" y="350" class="m" text-anchor="start">18.16 s</text>
<text x="20" y="422" class="m" text-anchor="start">Full index from nothing, 2 CPUs per container, 14 November 2026. Java, Go, Rust and Python include the SCIP indexer run.</text>
<rect x="20" y="432" width="12" height="12" rx="2" class="bar2"/>
<text x="38" y="442" class="m" text-anchor="start">Roslyn, in process</text>
<rect x="164.8" y="432" width="12" height="12" rx="2" class="bar1"/>
<text x="182.8" y="442" class="m" text-anchor="start">codegraph-ts (Node.js)</text>
<rect x="336.0" y="432" width="12" height="12" rx="2" class="bar3"/>
<text x="354.0" y="442" class="m" text-anchor="start">SCIP indexer and import</text>
</svg>
