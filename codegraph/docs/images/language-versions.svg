<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1116 492" width="1116" height="492" role="img" aria-labelledby="title desc">
<title id="title">Language and SDK versions tested</title>
<desc id="desc">The compiler is what reads the code (the SCIP routes: the indexer version this release was tested with). The levels are the two dialects the corpus writes with one answer key. The SDK image is the oldest toolchain the corpus runs on in Docker; the current SDK is the standard corpus image.</desc>
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .h { font-weight: 600; font-size: 14px; }
  .m { fill: #59636e; font-size: 11.5px; }
  .chip { font-size: 12px; }
  .bg { fill: #ffffff; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .c1 { fill: #ddf4ff; stroke: #0969da; } .c2 { fill: #fff8c5; stroke: #9a6700; } .c3 { fill: #dafbe1; stroke: #1a7f37; }
  .c4 { fill: #fbefff; stroke: #8250df; } .c5 { fill: #f6f8fa; stroke: #d1d9e0; }
  .ok { fill: #dafbe1; stroke: #1a7f37; } .warn { fill: #fff8c5; stroke: #9a6700; } .bad { fill: #ffebe9; stroke: #cf222e; } .none { fill: #f6f8fa; stroke: #d1d9e0; }
</style>
<rect class="bg" width="1116" height="492"/>
<text class="h" x="16" y="28">Language and SDK versions CodeGraph is tested against</text>
<text class="m" x="16" y="46">Read from Directory.Build.props, extractors/typescript/package.json, ScipIndexers.cs, tools/corpus/gen.py and run.py; tools/corpus/versions_chart.py redraws it.</text>
